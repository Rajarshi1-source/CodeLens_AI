name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codelensai
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codelensai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codelensai
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "6379"
        run: |
          chmod +x mvnw
          ./mvnw clean package -B

  review-quality-eval:
    name: Review-quality eval gate
    runs-on: ubuntu-latest
    needs: test-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codelensai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend jar
        working-directory: codelensai
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B
      - name: Boot backend (local provider)
        working-directory: codelensai
        env:
          LLM_PROVIDER: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codelensai
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "6379"
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"; cat backend.log; exit 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval deps
        run: pip install -r eval/requirements.txt
      - name: Run review-quality eval gate
        env:
          CODELENS_BASE_URL: http://localhost:8080
        run: python eval/run_eval.py --ci
