name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codelensai
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codelensai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codelensai
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "6379"
        run: |
          chmod +x mvnw
          ./mvnw clean package -B

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  review-quality-eval:
    name: Review-quality eval gate
    runs-on: ubuntu-latest
    needs: test-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codelensai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend jar
        working-directory: codelensai
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B
      - name: Boot backend (local provider)
        working-directory: codelensai
        env:
          LLM_PROVIDER: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codelensai
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "6379"
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"; cat backend.log; exit 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval deps
        run: pip install -r eval/requirements.txt
      - name: Run review-quality eval gate
        env:
          CODELENS_BASE_URL: http://localhost:8080
        run: python eval/run_eval.py --ci

  # Build + push Docker images to DockerHub on main. Inert until you opt in:
  #   - set repository Actions VARIABLE  ENABLE_DOCKER_PUSH = true
  #   - set repository SECRETS  DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, review-quality-eval]
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUSH == 'true' }}
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/codelensai-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/codelensai-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./codelensai
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to a single host running docker compose. Inert until you opt in:
  #   - set repository Actions VARIABLE  ENABLE_DEPLOY = true
  #   - set repository SECRETS  EC2_HOST, EC2_USER, EC2_SSH_KEY
  # The host must have /opt/codelensai with docker-compose.yml + .env, and pull the pushed images.
  # Railway alternative: replace this job with `railwayapp/railway-action` / the Railway CLI `up`.
  deploy:
    name: Deploy (EC2 via SSH)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/codelensai
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
