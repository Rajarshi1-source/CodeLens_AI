services:
  postgres:
    # pgvector: code_chunks.embedding is vector(512) with an HNSW index (G1 retrieval)
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=codelensai'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:7-alpine'
    # volatile-lru: evict only keys with a TTL (caches, presence, replay buffers) — never the review-jobs /
    # index-jobs streams (no TTL), which allkeys-lru could silently drop under memory pressure.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
