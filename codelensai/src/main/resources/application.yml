spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: codelensai
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codelensai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - read:user
              - user:email
              - repo

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Behind the frontend nginx proxy, build OAuth2 redirect URIs from X-Forwarded-* headers
  # so the GitHub callback stays same-origin (http://host:3000/login/oauth2/code/github).
  forward-headers-strategy: framework

codelens:
  llm:
    provider: ${LLM_PROVIDER:local}        # local | gpt5 | claude
    # OpenAI settings (provider=gpt5). Claude has its own block below.
    review-model: ${REVIEW_MODEL:gpt-5}
    summary-model: ${SUMMARY_MODEL:gpt-5-mini}
    temperature: 0.1
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:8000}
    max-tokens-per-chunk: 4000
    confidence-threshold: 0.4
    fallback-provider: ${LLM_FALLBACK_PROVIDER:local}   # cross-vendor failover when the primary's breaker opens
    local:
      pace-ms: ${CODELENS_LOCAL_PACE_MS:0}   # delay between the offline provider's events (demo: 700)
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:}
      review-model: ${CLAUDE_REVIEW_MODEL:claude-opus-5-5}
      summary-model: ${CLAUDE_SUMMARY_MODEL:claude-opus-5-5}   # claude-haiku-5-5 is the cheaper option
      effort: ${CLAUDE_EFFORT:high}
      max-tokens: ${CLAUDE_MAX_TOKENS:16000}
      server-fallback: true            # fallbacks:"default" on refusal (never sent for Haiku)
    budget:
      daily-tokens: ${LLM_DAILY_TOKEN_BUDGET:2000000}
      enforce-for-free-models: false
    pricing:
      models:                           # USD per million tokens
        "[local-mock]":
          input-per-mtok: 0
          output-per-mtok: 0
        "[claude-opus-5-5]":
          input-per-mtok: 4.00
          output-per-mtok: 20.00
        "[claude-sonnet-5-5]":
          input-per-mtok: 2.00
          output-per-mtok: 10.00
        "[claude-haiku-5-5]":
          input-per-mtok: 0.10
          output-per-mtok: 0.50
        "[gpt-5]":                      # fill in from the vendor price sheet
          input-per-mtok: ${GPT5_INPUT_PRICE:0}
          output-per-mtok: ${GPT5_OUTPUT_PRICE:0}
        "[gpt-5-mini]":
          input-per-mtok: ${GPT5_MINI_INPUT_PRICE:0}
          output-per-mtok: ${GPT5_MINI_OUTPUT_PRICE:0}
  prompts:
    review-version: ${REVIEW_PROMPT_VERSION:v2}
  retrieval:
    enabled: ${CODELENS_RETRIEVAL_ENABLED:true}
    max-context-tokens: 1500
    top-k: 4
  embedding:
    provider: ${CODELENS_EMBEDDING_PROVIDER:hashing}   # hashing (offline) | openai
    dimensions: 512
    openai-model: text-embedding-3-small
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  indexing:
    enabled: ${CODELENS_INDEXING_ENABLED:true}
    max-files: 2000
    max-file-bytes: 200000
  risk:
    high-threshold: 60
    medium-threshold: 30
  feedback:
    suppression-enabled: true
    min-votes: 5
    dismiss-rate: 0.7
  presence:
    ttl-seconds: ${CODELENS_PRESENCE_TTL_SECONDS:45}
  internal:
    enabled: ${CODELENS_INTERNAL_ENABLED:false}
    token: ${CODELENS_INTERNAL_TOKEN:}
  demo:
    enabled: false
  web:
    allowed-origins: ${CODELENS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:3000}
  encryption:
    secret: ${CODELENS_ENCRYPTION_SECRET:dev-only-32-byte-secret-key-change!!}
  langfuse:
    enabled: ${CODELENS_LANGFUSE_ENABLED:false}
    host: ${CODELENS_LANGFUSE_HOST:http://localhost:3000}
    public-key: ${CODELENS_LANGFUSE_PUBLIC_KEY:}
    secret-key: ${CODELENS_LANGFUSE_SECRET_KEY:}

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: codelensai

resilience4j:
  circuitbreaker:
    instances:
      llm:
        failureRateThreshold: 50
        slidingWindowSize: 20
        waitDurationInOpenState: 30s
        # A refusal or an exhausted budget is not an outage: never trip the breaker for them.
        ignoreExceptions:
          - com.codelensai.service.cost.BudgetExceededException
          - com.codelensai.service.llm.LlmRefusalException
      github:
        failureRateThreshold: 50
        slidingWindowSize: 20
        waitDurationInOpenState: 15s
      embedding:
        failureRateThreshold: 50
        slidingWindowSize: 20
        waitDurationInOpenState: 30s
  retry:
    instances:
      llm:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        enableRandomizedWait: true
        # Retrying cannot fix these; they go straight to the fallback method.
        ignoreExceptions:
          - com.codelensai.service.cost.BudgetExceededException
          - com.codelensai.service.llm.LlmRefusalException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      github:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
      embedding:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
  timelimiter:
    instances:
      llm:
        timeoutDuration: 60s
      github:
        timeoutDuration: 10s
  bulkhead:
    instances:
      llm:
        maxConcurrentCalls: 16
      github:
        maxConcurrentCalls: 8
