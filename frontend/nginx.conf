# In docker-compose the backend is reachable at http://backend:8080.
# Override with: docker build --build-arg ... (or edit) for other topologies.
upstream codelens_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the external scheme/host so the backend builds correct OAuth2 redirect URIs
    # (server.forward-headers-strategy=framework reads these).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # REST API.
    location /api/ {
        proxy_pass http://codelens_backend;
    }

    # Actuator (health/metrics) — handy for probes; Prometheus scrapes the backend directly.
    location /actuator/ {
        proxy_pass http://codelens_backend;
    }

    # WebSocket / SockJS endpoint (STOMP review stream).
    location /ws/ {
        proxy_pass http://codelens_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # GitHub OAuth2 flow (same-origin). Only the Spring endpoints are proxied:
    #   /oauth2/authorization/github  -> start login
    #   /login/oauth2/code/github     -> OAuth callback
    # The SPA keeps its own client-side /login route (logout uses POST /api/auth/logout).
    location /oauth2/ {
        proxy_pass http://codelens_backend;
    }
    location /login/oauth2/ {
        proxy_pass http://codelens_backend;
    }

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache the HTML shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
